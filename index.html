                            <div class="wins-line">${parseInt(p.wins || 0).toLocaleString()} wins</div>
                        </div>
                        ${cardMateria.length > 0 ? `
                        <div class="materia-strip">
                            ${cardMateria.map((m, i) => `<span style="font-size:10px;color:#b8a9ff;">M${i+1}: ${m}</span>${i < cardMateria.length - 1 ? '<span style="color:#444;">·</span>' : ''}`).join('')}
                        </div>` : ''}
                    `;
                    card.onclick = () => showDetails(p);
                    grid.appendChild(card);
            });

            document.querySelectorAll('.player-sort-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('sortBtn_' + currentPlayerSort);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function showDetails(p) {
            console.log("showDetails called for:", p.username);
            currentPlayer = p;
            charSearchTerm = '';
            let characters = [];

            // Pre-build a lookup of sub6mat arrays keyed by normalised character name
            // sub6mat keys look like: sub6matOrlandeau, "sub6matCecil Paladin", sub6matIngus etc.
            const materiaByChar = {};
            Object.keys(p).forEach(rawKey => {
                const cleanKey = rawKey.toString().toLowerCase().replace(/^["']+|["']+$/g, '');
                if (!cleanKey.startsWith('sub6mat')) return;
                const charPart = cleanKey.replace('sub6mat', '').replace(/ /g, '');
                const val = p[rawKey];
                // val is already parsed as an array by configparser; filter out empty slots
                if (Array.isArray(val)) {
                    materiaByChar[charPart] = val.slice(0, 6).map(m => m ? m.toString().replace(/["']/g, '').trim() : '').filter(m => m !== '');
                }
            });

            Object.keys(p).forEach(rawKey => {
                let key = rawKey.toString().toLowerCase();
                if (key.includes('awakeninglv')) {
                    let rawName = rawKey.replace(/awakeninglv/i, '').trim();
                    rawName = rawName.replace(/^["']|["']$/g, '').trim();
                    let normName = rawName.toLowerCase();
                    let normNoSpace = normName.replace(/ /g, '');
                    
                    let displayName = rawName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
                    
                    const level = parseInt(p[rawKey]) || 0;
                    
                    // Season 5 passive (still present in save for backward compat)
                    let passive = 'None';
                    const passiveMatchKey = Object.keys(p).find(k => {
                        const cleanKey = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '');
                        return cleanKey === `ps5${normName}` || cleanKey === `ps${normName}` ||
                               cleanKey === `ps5${normNoSpace}` || cleanKey === `ps${normNoSpace}`;
                    });
                    if (passiveMatchKey) {
                        passive = p[passiveMatchKey].toString().replace(/["']/g, '');
                    }

                    // Season 6 Materia — sub6mat<CharName> array
                    const materiaSlots = materiaByChar[normNoSpace] || [];

                    // sub6 / sub6type for substat decoding
                    const sub6Key = Object.keys(p).find(k => {
                        const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                        return ck === `sub6${normNoSpace}` && !ck.startsWith('sub6mat') && !ck.startsWith('sub6type');
                    });
                    const sub6typeKey = Object.keys(p).find(k => {
                        const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                        return ck === `sub6type${normNoSpace}`;
                    });
                    const sub6val     = sub6Key     ? p[sub6Key].toString().replace(/["']/g,'').padEnd(21,'0') : '000000000000000000000';
                    const sub6typeval = sub6typeKey ? p[sub6typeKey].toString().replace(/["']/g,'').padEnd(21,'0') : '000000000000000000000';
                    
                    const charInfo = characterData[normName] || characterData[normNoSpace] || {};
                    
                    characters.push({
                        name: rawName,
                        displayName: displayName,
                        level: level,
                        passive: passive,
                        materia: materiaSlots,
                        sub6: sub6val,
                        sub6type: sub6typeval,
                        awakening1: charInfo.Awakening1 || charInfo.awakening1 || '',
                        awakening2: charInfo.Awakening2 || charInfo.awakening2 || '',
                        awakening3: charInfo.Awakening3 || charInfo.awakening3 || '',
                        spe: charInfo.Speed || charInfo.speed || '',
                        specialty: charInfo.Specialty || charInfo.specialty || '',
                        description: charInfo.Description || charInfo.description || '',
                        role: charInfo.Role || '',
                        stats: charInfo.Stats || ''
                    });
                }
            });

            currentCharacters = characters;
            window.originalCharacters = [...characters];

            // If collection is full (162/162), the player has recruited every character.
            // Supplement the list with any characters that have no game data yet —
            // they're definitely recruited, just in limbo (never leveled or passive-added).
            const collectionFull = parseInt(p.collection || 0) >= 162;
            if (collectionFull) {
                const trackedNames = new Set(characters.map(c => c.name.toLowerCase().replace(/ /g, '')));
                const supplemented = new Set(); // prevent duplicate CSV entries from both index keys
                Object.entries(characterData).forEach(([key, charInfo]) => {
                    const name = (charInfo.Name || charInfo.name || '').trim();
                    if (!name) return;
                    if ((charInfo.Collectible || 'Yes') === 'No') return;
                    const normNoSpace = name.toLowerCase().replace(/ /g, '');
                    if (trackedNames.has(normNoSpace)) return;   // already has game data
                    if (supplemented.has(normNoSpace)) return;   // already added in this loop
                    supplemented.add(normNoSpace);
                    const displayName = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                    characters.push({
                        name: name.toLowerCase(),
                        displayName,
                        level: 0,
                        passive: 'None',
                        awakening1: charInfo.Awakening1 || charInfo.awakening1 || '',
                        awakening2: charInfo.Awakening2 || charInfo.awakening2 || '',
                        awakening3: charInfo.Awakening3 || charInfo.awakening3 || '',
                        spe: charInfo.Speed || charInfo.speed || '',
                        specialty: charInfo.Specialty || charInfo.specialty || '',
                        description: charInfo.Description || charInfo.description || '',
                        role: charInfo.Role || '',
                        stats: charInfo.Stats || '',
                        recruitedNotLeveled: true
                    });
                });
                currentCharacters = characters;
                window.originalCharacters = [...characters];
            }

            console.log("Characters found:", characters.length);
            openModal(p);
        }

        function awakeningPip(level, threshold, name) {
            if (level >= threshold) {
                return `<div class="awakening-pip unlocked">
                    <div class="pip-threshold pixel-font">W${threshold}</div>
                    <div class="pip-value" title="${name || '???'}">${name || '???'}</div>
                </div>`;
            }
            const remaining = threshold - level;
            return `<div class="awakening-pip locked">
                <div class="pip-threshold pixel-font">W${threshold}</div>
                <div class="pip-value">🔒 ${remaining} to go</div>
            </div>`;
        }

        let charSearchTerm = '';

        function charSearch(val) {
            charSearchTerm = val.toLowerCase();
            renderCharGrid();
        }

        function renderCharacterGrid(filter) {
            console.log("Rendering grid with filter:", filter);
            currentFilter = filter;

            // Only rebuild the full controls section if this is a full re-render
            // (i.e. called from showDetails or a sort/filter button, not from charSearch)
            const controlsEl = document.getElementById('charControls');
            if (!controlsEl) return;

            controlsEl.innerHTML = `
                <input
                    id="charSearchInput"
                    type="text"
                    value="${charSearchTerm.replace(/"/g,'&quot;')}"
                    placeholder="Search by name, specialty, description, materia..."
                    oninput="charSearch(this.value)"
                    style="width:100%;box-sizing:border-box;padding:8px 12px;border-radius:6px;border:1px solid #334466;background:#0f1621;color:#eee;font-size:13px;font-family:inherit;margin-bottom:8px;"
                >
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px;">
                    <button onclick="renderCharacterGrid('all')" class="filter-btn ${filter==='all'?'active':''}">All</button>
                    <button onclick="renderCharacterGrid('dps')" class="role-badge-dps filter-btn ${filter==='dps'?'active':''}">DPS</button>
                    <button onclick="renderCharacterGrid('tank')" class="role-badge-tank filter-btn ${filter==='tank'?'active':''}">Tank</button>
                    <button onclick="renderCharacterGrid('healer')" class="role-badge-healer filter-btn ${filter==='healer'?'active':''}">Healer</button>
                    <button onclick="renderCharacterGrid('support')" class="role-badge-support filter-btn ${filter==='support'?'active':''}">Support</button>
                    <button onclick="toggleSort('alpha')" id="alphaBtn" class="filter-btn ${window.currentSortMode==='alpha'?'active':''}">${window.currentSortAlpha==='desc'?'Z-A':'A-Z'}</button>
                    <button onclick="toggleSort('level')" id="levelBtn" class="filter-btn ${window.currentSortMode==='level'?'active':''}">${window.currentSortLevel==='asc'?'Low-Hi':'Hi-Low'}</button>
                    <button onclick="toggleSort('levelup')" id="levelupBtn" class="filter-btn ${window.currentSortMode==='levelup'?'active':''}">⬆ Level Up</button>
                </div>
            `;

            renderCharGrid();
        }

        function renderCharGrid() {
            let filtered = currentCharacters;

            // Role filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(char => (char.role || '').toLowerCase().includes(currentFilter));
            }

            // Text search — name, specialty, description, passive, materia
            if (charSearchTerm) {
                filtered = filtered.filter(char => {
                    const name    = (char.displayName || '').toLowerCase();
                    const spec    = (char.specialty   || '').toLowerCase();
                    const desc    = (char.description || '').toLowerCase();
                    const passive = (char.passive     || '').toLowerCase();
                    const materia = (char.materia || []).join(' ').toLowerCase();
                    return name.includes(charSearchTerm) || spec.includes(charSearchTerm)
                        || desc.includes(charSearchTerm) || passive.includes(charSearchTerm)
                        || materia.includes(charSearchTerm);
                });
            }

            // Update result count badge without rebuilding controls
            const countEl = document.getElementById('charResultCount');
            if (countEl) {
                countEl.textContent = charSearchTerm ? `${filtered.length} result${filtered.length !== 1 ? 's' : ''}` : '';
            }

            const gridEl = document.getElementById('charGrid');
            if (!gridEl) return;
            let html = '';
            html += '';

            filtered.forEach(char => {
                const roleClass = char.role.toLowerCase().includes('dps') ? 'dps' : char.role.toLowerCase().includes('tank') ? 'tank' : char.role.toLowerCase().includes('healer') ? 'healer' : char.role.toLowerCase().includes('support') ? 'support' : '';
                const statusBadge = char.recruitedNotLeveled
                    ? `<span style="font-size:10px;background:rgba(0,255,204,0.1);color:#00ffcc;padding:2px 6px;border-radius:4px;margin-left:6px;">RECRUITED</span>`
                    : char.level === 0
                    ? `<span style="font-size:10px;background:rgba(255,255,255,0.08);color:#888;padding:2px 6px;border-radius:4px;margin-left:6px;">UNLEVELED</span>`
                    : char.level >= 500
                    ? `<span style="font-size:10px;background:rgba(255,215,0,0.15);color:#ffd700;padding:2px 6px;border-radius:4px;margin-left:6px;">⭐ MASTERED</span>`
                    : '';
                html += `
                    <div class="char-card" style="--char-img:url('portrait/${encodeURIComponent(char.displayName)}.png')">
                        <div class="char-portrait-wrap">
                            <div class="char-portrait" style="background-image:url('portrait/${encodeURIComponent(char.displayName)}.png')"></div>
                            <div class="lv-badge pixel-font">LV${char.level}</div>
                        </div>
                        <div class="char-info">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                                <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
                                    <div class="pixel-font char-name">${char.displayName}</div>
                                    ${statusBadge}
                                </div>
                                ${char.role ? `<span class="role-badge role-badge-${roleClass}">${char.role}</span>` : ''}
                            </div>
                            <div style="font-size:13px;color:#ccc;margin-top:8px;">Stats: ${char.stats || 'N/A'}</div>
                            ${char.materia && char.materia.length > 0
                                ? `<div style="margin-top:8px;">
                                    <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Materia
                                        ${parseInt(currentPlayer.upgrade || 0) > 0 ? `<span style="margin-left:8px;background:rgba(0,200,255,0.15);color:#00c8ff;padding:1px 6px;border-radius:4px;font-size:10px;">🔼 ${currentPlayer.upgrade} Upgrade${currentPlayer.upgrade > 1 ? 's' : ''}</span>` : ''}
                                        ${parseInt(currentPlayer.legend || 0) > 0 ? `<span style="margin-left:4px;background:rgba(255,170,0,0.15);color:#ffaa00;padding:1px 6px;border-radius:4px;font-size:10px;">✦ ${currentPlayer.legend} Legend${currentPlayer.legend > 1 ? 's' : ''}</span>` : ''}
                                    </div>
                                    ${char.materia.slice(0, 6).map((m, i) => {
                                        const subs = decodeSubstats(char.sub6 || '', char.sub6type || '', i);
                                        const canUpgrade = UPGRADEABLE_MATERIA.has(m);
                                        const upgradeBadge = canUpgrade ? `<span style="font-size:10px;background:rgba(0,200,255,0.12);color:#00c8ff;padding:1px 5px;border-radius:3px;margin-left:4px;">🔼</span>` : '';
                                        const subHtml = subs.length > 0
                                            ? subs.map(s => `<span style="font-size:11px;${s.maxed ? 'color:#ffaa00;font-weight:bold;' : 'color:#ccc;'}">${s.stat} +${s.value}${s.maxed ? ' ★' : ''}</span>`).join(' &nbsp;·&nbsp; ')
                                            : '<span style="font-size:11px;color:#555;">no substats</span>';
                                        return `<div style="margin-bottom:5px;">
                                            <span style="font-size:12px;background:rgba(147,130,255,0.18);color:#b8a9ff;padding:2px 7px;border-radius:4px;border:1px solid rgba(147,130,255,0.3);">M${i+1}: ${m}</span>${upgradeBadge}
                                            <span style="margin-left:6px;">${subHtml}</span>
                                        </div>`;
                                    }).join('')}
                                   </div>`
                                : char.passive && char.passive !== 'None'
                                ? `<div style="font-size:13px;color:#ffb300;margin-top:2px;">Passive: ${char.passive}</div>`
                                : ''
                            }
                            <div class="awakening-pips">
                                ${awakeningPip(char.level, 100, char.awakening1)}
                                ${awakeningPip(char.level, 200, char.awakening2)}
                                ${awakeningPip(char.level, 500, char.awakening3)}
                            </div>
                            ${char.spe ? `<div style="font-size:13px;margin-top:10px;">Speed: ${char.spe}</div>` : ''}
                            ${char.specialty ? `<div style="font-size:13px;">Specialty: ${char.specialty}</div>` : ''}
                            ${char.description ? `<div style="font-size:12px;margin-top:8px;color:#ccc;">${char.description}</div>` : ''}
                        </div>
                    </div>`;
            });
            gridEl.innerHTML = html;
        }

        function openModal(p) {
            const activeUnit = (p.unit || '').replace(/ /g, '').toLowerCase();
            const activeDisplayName = (p.unit || 'Unknown').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

            // Materia
            const activeMateriaKey = Object.keys(p).find(k => {
                const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                if (!ck.startsWith('sub6mat')) return false;
                const charPart = ck.replace('sub6mat', '');
                return activeUnit === charPart || activeUnit.startsWith(charPart) || charPart.startsWith(activeUnit);
            });
            const activeMateria = activeMateriaKey && Array.isArray(p[activeMateriaKey])
                ? p[activeMateriaKey].slice(0, 6).map(m => m ? m.toString().trim() : '').filter(m => m !== '')
                : [];

            // sub6 / sub6type for active hero substats
            const activeSub6Key = Object.keys(p).find(k => {
                const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                if (ck.startsWith('sub6mat') || ck.startsWith('sub6type')) return false;
                const charPart = ck.replace('sub6', '');
                return activeUnit === charPart || activeUnit.startsWith(charPart) || charPart.startsWith(activeUnit);
            });
            const activeSub6typeKey = Object.keys(p).find(k => {
                const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                if (!ck.startsWith('sub6type')) return false;
                const charPart = ck.replace('sub6type', '');
                return activeUnit === charPart || activeUnit.startsWith(charPart) || charPart.startsWith(activeUnit);
            });
            const activeSub6     = activeSub6Key     ? p[activeSub6Key].toString().replace(/["']/g,'').padEnd(21,'0')     : '000000000000000000000';
            const activeSub6type = activeSub6typeKey ? p[activeSub6typeKey].toString().replace(/["']/g,'').padEnd(21,'0') : '000000000000000000000';

            // Awakening level for the active hero
            const activeAwkKey = Object.keys(p).find(k => {
                const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                if (!ck.startsWith('awakeninglv') || ck === 'awakeningexp') return false;
                const charPart = ck.replace('awakeninglv', '');
                return activeUnit === charPart || activeUnit.startsWith(charPart) || charPart.startsWith(activeUnit);
            });
            const activeLevel = activeAwkKey ? parseInt(p[activeAwkKey]) || 0 : 0;

            // Passive for active hero
            const activePassiveKey = Object.keys(p).find(k => {
                const ck = k.toString().toLowerCase().replace(/^["']+|["']+$/g, '').replace(/ /g, '');
                const prefix = ck.startsWith('ps5') ? 'ps5' : ck.startsWith('ps') ? 'ps' : null;
                if (!prefix) return false;
                const charPart = ck.replace(prefix, '');
                return activeUnit === charPart || activeUnit.startsWith(charPart) || charPart.startsWith(activeUnit);
            });
            const activePassive = activePassiveKey ? p[activePassiveKey].toString().replace(/["']/g,'') : 'None';

            // Character info from CSV
            const activeCharInfo = characterData[activeUnit] || characterData[(p.unit||'').toLowerCase()] || {};
            const activeRole = activeCharInfo.Role || p.role || '';
            const activeRoleClass = activeRole.toLowerCase().includes('dps') ? 'dps' : activeRole.toLowerCase().includes('tank') ? 'tank' : activeRole.toLowerCase().includes('healer') ? 'healer' : activeRole.toLowerCase().includes('support') ? 'support' : '';

            // Build Materia substat rows for the active hero card
            const activeMateriaHtml = activeMateria.length > 0 ? `
                <div style="margin-top:12px;">
                    <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Materia
                        ${parseInt(p.upgrade || 0) > 0 ? `<span style="margin-left:8px;background:rgba(0,200,255,0.15);color:#00c8ff;padding:1px 6px;border-radius:4px;font-size:10px;">🔼 ${p.upgrade} Upgrade${p.upgrade > 1 ? 's' : ''}</span>` : ''}
                        ${parseInt(p.legend || 0) > 0 ? `<span style="margin-left:4px;background:rgba(255,170,0,0.15);color:#ffaa00;padding:1px 6px;border-radius:4px;font-size:10px;">✦ ${p.legend} Legend${p.legend > 1 ? 's' : ''}</span>` : ''}
                    </div>
                    ${activeMateria.map((m, i) => {
                        const rawSub6     = activeSub6     || '000000000000000000000';
                        const rawSub6type = activeSub6type || '000000000000000000000';
                        // Find the actual slot index in the full 7-slot array
                        const fullMatArray = activeMateriaKey && Array.isArray(p[activeMateriaKey]) ? p[activeMateriaKey].slice(0,7) : [];
                        const slotIdx = fullMatArray.findIndex((v, idx) => idx <= 5 && v && v.toString().trim() === m && !fullMatArray.slice(0, idx).some(prev => prev && prev.toString().trim() === m));
                        const subs = decodeSubstats(rawSub6, rawSub6type, slotIdx >= 0 ? slotIdx : i);
                        const canUpgrade = UPGRADEABLE_MATERIA.has(m);
                        const upgradeBadge = canUpgrade ? `<span style="font-size:10px;background:rgba(0,200,255,0.12);color:#00c8ff;padding:1px 5px;border-radius:3px;margin-left:4px;">🔼</span>` : '';
                        const subHtml = subs.length > 0
                            ? subs.map(s => `<span style="font-size:11px;${s.maxed ? 'color:#ffaa00;font-weight:bold;' : 'color:#ccc;'}">${s.stat} +${s.value}${s.maxed ? ' ★' : ''}</span>`).join(' &nbsp;·&nbsp; ')
                            : '<span style="font-size:11px;color:#555;">no substats</span>';
                        return `<div style="margin-bottom:5px;">
                            <span style="font-size:12px;background:rgba(147,130,255,0.18);color:#b8a9ff;padding:2px 7px;border-radius:4px;border:1px solid rgba(147,130,255,0.3);">M${i+1}: ${m}</span>${upgradeBadge}
                            <span style="margin-left:6px;">${subHtml}</span>
                        </div>`;
                    }).join('')}
                </div>` : '';

            document.getElementById('modalContent').innerHTML = `
                <span onclick="closeModal()" style="position:absolute;top:15px;right:25px;font-size:36px;cursor:pointer;color:#ff6666;">×</span>
                <h2>${p.username}</h2>
                <p style="font-size:13px;color:#aaa;margin-top:2px;margin-bottom:14px;">
                    ASC ${p.ascension || 0} &nbsp;·&nbsp;
                    <span style="color:#ffcc00;">AWAKENING ${p.awakeningexp || 0}%</span> &nbsp;·&nbsp;
                    Collection ${p.collection || 0}/162 &nbsp;·&nbsp;
                    Gil ${parseInt(p.gil||0).toLocaleString()} &nbsp;·&nbsp;
                    ${parseInt(p.wins||0).toLocaleString()} wins
                </p>

                <!-- Active Hero Card -->
                <div class="char-card" style="--char-img:url('portrait/${encodeURIComponent(activeDisplayName)}.png');margin-bottom:20px;border:2px solid #00ffcc;box-shadow:0 0 14px rgba(0,255,204,0.2);">
                    <div class="char-portrait-wrap">
                        <div class="char-portrait" style="background-image:url('portrait/${encodeURIComponent(activeDisplayName)}.png');width:80px;height:80px;"></div>
                        <div class="lv-badge pixel-font">LV${activeLevel}</div>
                    </div>
                    <div class="char-info">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <div class="pixel-font char-name">${activeDisplayName}</div>
                                <span class="active-tag pixel-font">ACTIVE</span>
                            </div>
                            ${activeRole ? `<span class="role-badge role-badge-${activeRoleClass}">${activeRole}</span>` : ''}
                        </div>
                        <div style="font-size:13px;color:#ccc;margin-top:6px;">Stats: ${activeCharInfo.Stats || 'N/A'}</div>
                        ${activeMateria.length === 0 && activePassive !== 'None' ? `<div style="font-size:13px;color:#ffb300;margin-top:4px;">Passive: ${activePassive}</div>` : ''}
                        ${activeMateriaHtml}
                        <div class="awakening-pips" style="margin-top:12px;">
                            ${awakeningPip(activeLevel, 100, activeCharInfo.Awakening1 || '')}
                            ${awakeningPip(activeLevel, 200, activeCharInfo.Awakening2 || '')}
                            ${awakeningPip(activeLevel, 500, activeCharInfo.Awakening3 || '')}
                        </div>
                        ${activeCharInfo.Specialty ? `<div style="font-size:12px;color:#aaa;margin-top:8px;">Specialty: ${activeCharInfo.Specialty}</div>` : ''}
                        ${activeCharInfo.Description ? `<div style="font-size:12px;color:#ccc;margin-top:6px;line-height:1.5;">${activeCharInfo.Description}</div>` : ''}
                    </div>
                </div>

                <h2>Recruited Characters</h2>
                <div id="charControls"></div>
                <span id="charResultCount" style="font-size:12px;color:#aaa;display:block;margin:-10px 0 10px;"></span>
                <div id="charGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;"></div>
            `;
            document.getElementById('modal').style.display = 'block';
            renderCharacterGrid('all');
            console.log("Modal display set to block");
        }

        function levelUpScore(char, preferredRole) {
            const lv = char.level;
            const role = (char.role || '').toLowerCase();
            const pref = (preferredRole || '').toLowerCase();
            const roleBonus = (role && pref && role.includes(pref.split(' ')[0])) ? 0 : 1000;

            if (lv >= 500) return 90000 + roleBonus;                     // mastered — bottom
            if (lv === 0 && !char.recruitedNotLeveled) return 70000 + roleBonus; // ambiguous zero — near bottom
            if (char.recruitedNotLeveled) return 60000 + roleBonus;      // confirmed recruited, not started

            // Tier 1: approaching W100 — cheapest +2% Awakening, highest priority
            if (lv < 100) return 0 + (100 - lv) + roleBonus;

            // Tier 2: approaching W200 — still efficient, same Awakening gain as W100
            if (lv < 200) return 10000 + (200 - lv) + roleBonus;

            // Tier 3: approaching W500 — 300 wins for same +2%, lower ROI
            return 30000 + (500 - lv) + roleBonus;
        }

        function toggleSort(type) {
            if (!currentCharacters || !currentPlayer) return;
            window.currentSortMode = type;
            let sorted = [...(window.originalCharacters || currentCharacters)];
            if (type === 'level') {
                window.currentSortLevel = window.currentSortLevel === 'desc' ? 'asc' : 'desc';
                if (window.currentSortLevel === 'desc') {
                    sorted.sort((a, b) => b.level - a.level);
                } else {
                    sorted.sort((a, b) => a.level - b.level);
                }
            } else if (type === 'levelup') {
                sorted.sort((a, b) => levelUpScore(a, currentPlayer.role) - levelUpScore(b, currentPlayer.role));
            } else {
                window.currentSortAlpha = window.currentSortAlpha === 'asc' ? 'desc' : 'asc';
                if (window.currentSortAlpha === 'asc') {
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                } else {
                    sorted.sort((a, b) => b.name.localeCompare(a.name));
                }
            }
            currentCharacters = sorted;
            renderCharacterGrid(currentFilter);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function getMastered(p) {
            return Object.entries(p).filter(([k, v]) => {
                const cleanKey = k.toLowerCase().replace(/^["']+|["']+$/g, '');
                return cleanKey.startsWith('awakeninglv') && cleanKey !== 'awakeningexp'
                    && parseInt(String(v).replace(/["']/g, '') || 0) >= 500;
            }).length;
        }

        function buildSpriteRow(elementId, count) {
            const names = [...new Set(Object.values(characterData).map(c => c.Name || c.name).filter(Boolean))];
            const shuffled = names.sort(() => Math.random() - 0.5).slice(0, count);
            const html = shuffled.map(name => {
                const fileName = name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
                return `<img src="portrait/${encodeURIComponent(fileName)}.png" class="hero-sprite" alt="" title="${name}">`;
            }).join('');
            const el = document.getElementById(elementId);
            if (el) el.innerHTML = html;
        }

        buildSpriteRow('spriteRowLeft', 5);
        buildSpriteRow('spriteRowRight', 5);
        filterPlayers();
    </script>
</body>
</html>
